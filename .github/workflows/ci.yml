# 린트와 단위 테스트. push·PR 마다 약 1분.
#
# 통합 테스트(72건)와 평가 하네스는 **일부러 빠져 있다.** 둘 다 실제 코퍼스
# (82문서·1,712청크)를 전제하고, CI 에서 채우려면 마이그레이션 + 재색인 35분 +
# 임베딩 모델 2GB 다운로드가 매 실행마다 필요하다. 로컬에서 돌린다:
#   set -a; . ./.env; set +a
#   POSTGRES_HOST=127.0.0.1 POSTGRES_PORT=5433 REDIS_HOST=127.0.0.1 \
#     python -m pytest tests/integration -m integration -q
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 는 Dockerfile 의 python:3.12-slim 과 맞춘 것이다. 개발 호스트가
      # 3.14 라도 CI 는 배포되는 인터프리터를 검사한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # `pip install -e .` 는 쓰지 않는다: 최상위 디렉터리가 여럿이라
      # setuptools 자동 탐색이 실패한다(실측). Dockerfile 과 같은 방식으로
      # 의존성만 설치하고, pytest 는 저장소 루트에서 돌려 `app` 을 임포트한다.
      #
      # `ml` 엑스트라(torch·sentence-transformers)는 설치하지 않는다.
      # NFR-28 대로 단위 테스트는 모델에 닿지 않으므로, 없이도 전부 통과한다
      # (실측: 깨끗한 venv 에서 677 통과 / 10초).
      - name: Install dependencies (base + dev, no ml)
        run: |
          python - <<'PY'
          import tomllib, pathlib
          d = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          deps = d["project"]["dependencies"] + d["project"]["optional-dependencies"]["dev"]
          pathlib.Path("ci-requirements.txt").write_text("\n".join(deps), encoding="utf-8")
          PY
          python -m pip install --upgrade pip
          python -m pip install -r ci-requirements.txt

      - name: Lint
        run: python -m ruff check app/ tests/ migrations/

      # 자격증명 없이 돈다. conftest 가 더미값을 setdefault 하고, 테스트는
      # DB·네트워크·모델 어디에도 닿지 않는다(NFR-28).
      - name: Unit tests
        run: python -m pytest tests/unit -q
