# LLM 단가표 (CP-1, BR-96, NFR-19, NFR-23)
#
# 단위: USD per 1M tokens.
#
# 여기 없는 모델의 비용은 0 이 아니라 **NULL** 로 기록된다. 0 으로 적으면 사용량
# 화면이 "무료"라고 거짓말하기 때문이다 (NFR-8: 데이터 없음을 추정으로 메우지 않는다).
# 화면은 그런 호출을 합계에서 제외하되 **제외 건수를 함께 표시**한다.
#
# 단가는 공급자가 바꾸므로 이 파일은 사실의 기록이지 계약이 아니다. 갱신하면 이후
# 호출부터 반영되며, 과거 `llm_call.cost_usd` 는 소급 수정하지 않는다 — 그때 지불한
# 금액이 그때의 사실이다.

claude-opus-5:
  input_per_1m: 5.00
  output_per_1m: 25.00
  cache_read_per_1m: 0.50

claude-sonnet-5:
  input_per_1m: 3.00
  output_per_1m: 15.00
  cache_read_per_1m: 0.30

claude-haiku-4-5-20251001:
  input_per_1m: 1.00
  output_per_1m: 5.00
  cache_read_per_1m: 0.10

# Gemini 무료 티어. 0 을 적는 것과 항목을 비워 두는 것은 다르다 —
# 여기서 0 은 **실제로 0** 이며(NFR-20 의 로컬 임베딩과 같은 성격), 미등록은
# "모른다"는 뜻이다(BR-96). 유료 티어로 올리면 이 값을 실제 단가로 바꾼다.
gemini-3.7-flash:
  input_per_1m: 0.00
  output_per_1m: 0.00
  cache_read_per_1m: 0.00

gemini-3.6-flash:
  input_per_1m: 0.00
  output_per_1m: 0.00
  cache_read_per_1m: 0.00

gemini-3.5-flash:
  input_per_1m: 0.00
  output_per_1m: 0.00
  cache_read_per_1m: 0.00

gemini-3.1-flash-lite:
  input_per_1m: 0.00
  output_per_1m: 0.00
  cache_read_per_1m: 0.00
