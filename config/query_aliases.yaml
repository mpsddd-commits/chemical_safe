# 질의 전용 별칭 — BR-65a (2026-09-01)
#
# `substance_synonym` 은 출처가 실제로 싣는 이름만 담는다(BR-99): 생성한 변형을
# 저장하면 카드가 아무도 발표한 적 없는 이름을 사실처럼 내보인다(NFR-8).
# 그 규칙은 옳고, 그대로 둔다.
#
# 그러나 사용자는 출처의 표기로 질문하지 않는다. u4 실측: "메탄올을 흡입하면
# 시각에 어떤 영향이 있나요?"(sub-05)는 마스터가 '메틸알코올'만 알아서
# 해석조차 되지 않았다. 이 파일은 그 간극을 **질의 쪽에서만** 메운다 —
# 여기의 별칭은 DB 에 저장되지 않고, 카드·화면 어디에도 나타나지 않으며,
# 검색 시점에 정식 명칭으로 바뀌어 동의어 테이블과 대조될 뿐이다.
#
# 값(정식 명칭)은 substance_synonym.term 에 실제로 존재해야 한다 —
# 존재하지 않으면 그 별칭은 조용히 아무 일도 하지 않는다. 통합 테스트가
# 이 파일의 모든 값을 실제 마스터와 대조한다.
#
# 추가 기준: 화학 명명 관행에서 널리 통용되는 동일 물질의 다른 표기만.
# 오타 교정·추측성 매핑은 넣지 않는다.
aliases:
  메탄올: 메틸알코올
  메틸알콜: 메틸알코올
