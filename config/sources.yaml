# Data source definitions (FR-1~4).
#
# Adapters are configuration-driven on purpose: the public API contracts could
# not be verified without issued keys (risk R-1), so endpoint paths, auth
# parameter names and field names live here and can be corrected without
# touching code.
#
# `api_key_env` names an environment variable. The value is never stored here
# or in the database (NFR-14).
#
# `auth_param` is the query parameter the source expects the credential in.
# It is NOT the same everywhere: data.go.kr services use `serviceKey` (some
# spell it `ServiceKey`), while 국가법령정보 uses `OC` and expects the ID part
# of the registered e-mail rather than an issued key. Hardcoding `serviceKey`
# was the original assumption and it was wrong for two of the three sources.

sources:
  # 물질 정보.
  #
  # 원래 설정된 1480523/ChemicalInfoService 는 실재하지 않는다: 실호출 결과
  # NO_OPENAPI_SERVICE_ERROR(코드 12, "해당 오픈API 서비스가 없거나 폐기됨").
  # 화학사고 소스와 같은 원인 - 인증키 없이 가정으로 작성한 주소였다.
  #
  # 아래 주소는 실호출로 **존재가 확인**되었다: 같은 키로 코드 30("등록되지 않은
  # 서비스키")을 반환하는데, 이는 서비스는 있고 활용신청만 안 된 상태라는 뜻이다
  # (없는 서비스는 코드 12 를 준다). data.go.kr 15072442 활용신청 후 동작한다.
  #
  # 응답은 CAS 번호로 조회하며 증상·흡입·피부·눈·경구 영향을 준다. 16개 절 구조가
  # 아니므로 구조 분해는 unstructured 로 떨어진다(BR-24) - 정상 동작이다.
  - source_id: ncis_substance
    name: 화학물질안전관리정보 (물질 기본정보·건강영향)
    kind: api
    # `substance`, not `msds` (2026-08-30). A substance record and a vendor MSDS
    # are different documents, and sharing a type meant BR-69's type spread had
    # nothing to separate - one MSDS could fill every retrieval slot for a CAS
    # query. `safeenv retype` reconciles existing rows with this value.
    doc_type: substance
    base_url: https://apis.data.go.kr/1480802/iciskischem
    requires_api_key: true
    api_key_env: NCIS_API_KEY
    auth_param: ServiceKey
    list_path: /kischemlist
    page_size: 100
    url_template: https://www.data.go.kr/data/15072442/openapi.do#dataNo={external_id}
    field_map:
      external_id: dataNo
      cas_number: casNo
      name_ko: chemKo
      name_en: chemEn
      symptom: symptom
      inhale: inhale
      skin: skin
      eyeball: eyeball
      oral: oral

  - source_id: law_api
    name: 국가법령정보 (화관법·화평법·산안법)
    kind: api
    doc_type: law
    base_url: https://www.law.go.kr/DRF
    requires_api_key: true
    api_key_env: LAW_API_KEY
    # 국가법령정보 공동활용은 인증키가 아니라 가입 이메일의 ID 부분을 OC 로 받는다.
    auth_param: OC
    list_path: /lawSearch.do
    detail_path: /lawService.do
    # 응답이 LawSearch.law 로 오며 item/items/row 관례를 따르지 않는다.
    rows_key: law
    # 상세 조회는 소문자 id 를 받지 않는다: 대문자 ID + target 이 필요하다.
    detail_id_param: ID
    detail_params:
      target: law
    extra_params:
      type: JSON
    targets:
      - 화학물질관리법
      - 화학물질의 등록 및 평가 등에 관한 법률
      - 산업안전보건법
    field_map:
      external_id: 법령ID
      title: 법령명한글
      law_name: 법령명한글
      body: 조문내용
      published_at: 시행일자
      revised_at: 공포일자

  # 화학사고 정보.
  #
  # The endpoint originally configured here (1480523/ChemicalAccidentService)
  # does not exist, so no issued key could ever have worked against it. The
  # published service is 화학물질안전원 화학사고정보 (data.go.kr 15072446),
  # served from the 1480802 namespace:
  #   https://www.data.go.kr/data/15072446/openapi.do
  #
  # The list operation carries the whole record, so there is no detail call.
  # No per-record public page exists; `url_template` therefore points at the
  # dataset the record came from, with the record number as a fragment, which
  # is the most specific honest provenance available (BR-32).
  - source_id: incident_data
    name: 화학사고 사례 (화학물질안전원 화학사고정보)
    kind: api
    doc_type: incident
    base_url: https://apis.data.go.kr/1480802/iciscsc
    requires_api_key: true
    api_key_env: INCIDENT_API_KEY
    # 서비스 명세가 대문자 S 로 표기한다.
    auth_param: ServiceKey
    list_path: /csclist
    page_size: 100
    url_template: https://www.data.go.kr/data/15072446/openapi.do#dataNo={external_id}
    field_map:
      external_id: dataNo
      occurred_at: cscDe
      # 같은 필드를 published_at 으로도 읽는다. 이것이 없으면 수집 워터마크가
      # 항상 NULL 이라 증분 수집(FR-7, BR-13)이 동작하지 않는다.
      published_at: cscDe
      incident_type: cscTy
      area: area
      # 명세에 없으나 실제 응답에 포함된다 (2026-08-24 실호출 확인).
      address: addr
      place: place
      substances: chem
      cause: cause
      summary: summary

  - source_id: msds_pdf
    name: 공개 MSDS 문서
    kind: pdf
    doc_type: msds
    base_url: https://msds.kosha.or.kr
    requires_api_key: false
    api_key_env: null
    # Populated by the substance ingestion run; each entry becomes one SourceRef.
    manifest_path: config/msds_manifest.json
